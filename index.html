<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최해주 | Portfolio</title>
    <!-- FONT AWESOME -->
    <script src="https://kit.fontawesome.com/96b5911d82.js" crossorigin="anonymous"></script>
    <!-- SUIT -->
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/intro.css">
    <link rel="stylesheet" href="./css/loading.css">
    <link rel="stylesheet" href="./css/skills.css">
    <link rel="stylesheet" href="./css/project.css">
</head>

<body class="is-loading">
    <!-- 로딩 화면 -->
    <div id="page-loader" class="page-loader" role="status" aria-live="polite" aria-label="페이지를 불러오는 중입니다.">
        <div class="loader-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <p class="loader-message sr-only"></p>
        <button class="loader-retry" type="button" hidden>다시 불러오기</button>
    </div>

    <!-- 헤더 -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <h1 class="sr-only">최해주 포트폴리오</h1>
                <a href="#">oojea_h</a>
            </div>

            <nav class="menu" aria-label="주 메뉴">
                <ul>
                    <li><a href="#">intro</a></li>
                    <li><a href="#skills">skills</a></li>
                    <li><a href="#project">project</a></li>
                    <li><a href="#contact">contact</a></li>
                </ul>
            </nav>

            <nav class="sns" aria-label="외부 링크">
                <ul>
                    <li>
                        <a href="https://oojeah.tistory.com/" target="_blank">
                            <i class="fa-solid fa-t"></i>
                        </a>
                    </li>
                    <li>
                        <a href="https://github.com/koinoniaHJ" target="_blank">
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 메인 -->
    <main id="main">
        <section id="intro">
            <h2 class="sr-only">코드를 읽는 개발자 최해주</h2>

            <div class="intro-sticky">
                <div class="intro-stage container">
                    <!-- 왼쪽 문구 -->
                    <div class="intro-text intro-text-left">
                        <p class="intro-title"><span>코드를</span> 읽는</p>
                        <p class="intro-description">
                            AI 시대에 필요한 건<br>
                            코드를 읽는 힘
                        </p>
                    </div>

                    <!-- 오른쪽 문구 -->
                    <div class="intro-text intro-text-right">
                        <p class="intro-description">
                            AI 코드를 검증해야 하는 시대,<br>
                            탄탄한 기본기가 기반입니다.
                        </p>
                        <p class="intro-title"><span>개발자</span> 최해주</p>
                    </div>

                    <!-- 스크롤 이미지 -->
                    <div class="intro-laptop">
                        <img id="laptop-image" src="./images/laptop/0001.png" alt="회전하는 노트북" width="1920" height="1080">
                    </div>

                    <!-- 스크롤 안내 -->
                    <div class="intro-scroll" aria-hidden="true">
                        <span>SCROLL</span>
                        <span class="intro-scroll-arrow">
                            <i class="fa-solid fa-angle-down"></i>
                        </span>
                    </div>
                </div>
            </div>
        </section>
        <!-- skills -->
        <section id="skills">
            <div class="container">
                <h2 class="skills-title section-title">
                    <span>tech</span> stack
                </h2>
                <div class="skills-list"></div>
            </div>
        </section>

        <!-- 스킬 템플릿 -->
        <template id="skill-template">
            <article class="skill-card">
                <h3 class="skill-category"></h3>
                <ul class="skill-list"></ul>
            </article>
        </template>
        <!-- project -->
        <section id="project">
            <div class="container">
                <h2 class="project-title section-title">project</h2>
                <div class="project-list"></div>
            </div>
        </section>

        <!-- 프로젝트 카드 템플릿 -->
        <template id="project-template">
            <article class="project-card">
                <div class="project-overview">
                    <h3 class="project-name"></h3>
                    <p class="project-type"></p>
                    <div class="project-thumbnail"></div>
                </div>

                <div class="project-details">
                    <dl class="project-specs">
                        <div class="project-spec">
                            <dt>Summary</dt>
                            <dd class="project-summary"></dd>
                        </div>
                        <div class="project-spec">
                            <dt>Language</dt>
                            <dd class="project-language"></dd>
                        </div>
                    </dl>

                    <div class="project-links">
                        <a class="project-site" target="_blank" rel="noopener noreferrer">
                            <i class="fa-solid fa-link" aria-hidden="true"></i>
                            <span></span>
                        </a>
                        <a class="project-github" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-github" aria-hidden="true"></i>
                            <span></span>
                        </a>
                    </div>
                </div>
            </article>
        </template>

        <section id="contact">
            <div class="container">
                <h2>contact</h2>
            </div>
        </section>
    </main>

    <script src="./js/loading.js"></script>
    <script src="./js/intro.js"></script>
    <script src="./js/skills.js"></script>
    <script src="./js/project.js"></script>
</body>

</html>
